<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Cartoon schema of the measles model (mini-project). Rendered to
       mazelen_schema.png for the book; emoji need a colour-emoji font. -->
  <defs>
    <marker id="pijl" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- the model: a soft area around S and I -->
  <rect x="204" y="18" width="328" height="222" rx="36" fill="#fff3ea" stroke="#e8601d" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="360" y="222" font-size="15" font-weight="700" fill="#e8601d" text-anchor="middle">het model</text>

  <!-- births -->
  <text x="80" y="62" font-size="16" font-weight="700" text-anchor="middle" fill="#333">geboortes</text>
  <circle cx="80" cy="120" r="44" fill="#eef3fb" stroke="#333" stroke-width="2.5"/>
  <text x="80" y="136" font-size="44" text-anchor="middle">👶</text>

  <!-- S -->
  <text x="270" y="52" font-size="18" font-weight="700" text-anchor="middle" fill="#333">S <tspan font-weight="400" font-size="15">vatbaar</tspan></text>
  <circle cx="270" cy="115" r="50" fill="#f6e6c4" stroke="#333" stroke-width="2.5"/>
  <text x="270" y="132" font-size="48" text-anchor="middle">🙂</text>

  <!-- I -->
  <text x="450" y="52" font-size="18" font-weight="700" text-anchor="middle" fill="#c0392b">I <tspan font-weight="400" font-size="15">ziek</tspan></text>
  <circle cx="450" cy="115" r="50" fill="#f9cfc8" stroke="#c0392b" stroke-width="3"/>
  <text x="450" y="132" font-size="48" text-anchor="middle">🤒</text>

  <!-- recovered: outside the model, faded -->
  <g opacity="0.55">
    <text x="645" y="60" font-size="15" text-anchor="middle" fill="#555">hersteld</text>
    <circle cx="645" cy="115" r="42" fill="#ffffff" stroke="#777" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="645" y="130" font-size="40" text-anchor="middle">😌</text>
  </g>

  <!-- vaccinated: outside the model, faded -->
  <g opacity="0.55">
    <circle cx="80" cy="290" r="36" fill="#ffffff" stroke="#777" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="80" y="303" font-size="34" text-anchor="middle">💉</text>
    <text x="126" y="296" font-size="15" fill="#555">gevaccineerd</text>
  </g>

  <!-- flows -->
  <path d="M124,118 L216,116" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#pijl)"/>
  <text x="163" y="104" font-size="17" font-style="italic" text-anchor="middle" fill="#333">b(1−p)</text>

  <path d="M80,164 L80,250" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#pijl)"/>
  <text x="66" y="214" font-size="17" font-style="italic" text-anchor="end" fill="#333">bp</text>

  <path d="M322,115 L394,115" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#pijl)"/>
  <text x="360" y="104" font-size="17" font-style="italic" text-anchor="middle" fill="#333">βSI</text>

  <path d="M502,115 L599,115" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#pijl)"/>
  <text x="568" y="104" font-size="17" font-style="italic" text-anchor="middle" fill="#333">gI</text>

  <!-- deaths: straight down, out of the model -->
  <path d="M270,166 L270,268" fill="none" stroke="#333" stroke-width="2.2" marker-end="url(#pijl)"/>
  <text x="282" y="262" font-size="16" font-style="italic" fill="#333">dS</text>
  <path d="M450,166 L450,268" fill="none" stroke="#333" stroke-width="2.2" marker-end="url(#pijl)"/>
  <text x="462" y="262" font-size="16" font-style="italic" fill="#333">dI</text>
</svg>
