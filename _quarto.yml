project:
  type: book
  resources:
    - Statistiek/Applets/*.html
    - print.js

lang:
  nl

execute:
  freeze: false  # auto -> re-render only when source changes
  cache: false   # true -> re-render chunks only when chunk changes 
    
# Course year on the cover of the printed book (print.qmd). "auto" = the
# current academic year at the moment of printing (from 1 September on, the
# next one), e.g. "2026-2027". Or fill in a fixed year here.
cursusjaar: "auto"

book:
  title: "Biologische Modellen en Statistiek"
  author: "Vakgroep Theoretische Biologie, Universiteit Utrecht"
  language: "nl"
  page-footer:
    left: |
      Vakgroep Theoretische Biologie, Universiteit Utrecht.
    right: |
      Dit boek is gemaakt met <a href="https://quarto.org/">Quarto</a>.
  date: "01/11/2026"
  #cover-image: "figuren/cover.png"
  favicon: "figuren/favicon/favicon.ico"
  sidebar:
    logo: 'figuren/favicon/android-chrome-512x512.png'
    logo-alt: 'Cursusboek voor Biologische Modellen en Statistiek (voorheen: Kwantitatieve Biologie)'
    type: "dark"
    collapse-level: 1
    style: "floating" #"floating/docked"
    pinned: true
    title: "Biologische <br>Modellen en Statistiek"
  chapters: 
    - part: "Cursusinformatie"
      chapters:
        - index.qmd
        - cursusinformatie.qmd
        - planning.qmd
        - slides.qmd
        - links.qmd
        - print.qmd
    - part: "Basisprincipes van R"
      chapters:
        - Programmeren/introductie_R.qmd
        - Programmeren/introductie_R2.qmd
        - Programmeren/intro_R_questions.qmd
    - part: "Basiswiskunde"
      chapters:
        - Wiskunde/inleiding.qmd
        - Wiskunde/algebra.qmd
        - Wiskunde/breuken.qmd
        - Wiskunde/exponenten.qmd
        - Wiskunde/limieten.qmd
        - Wiskunde/afgeleiden.qmd
        - Wiskunde/schetsen.qmd
        - Wiskunde/wiskunde_questions.qmd
    - part: "Biologische modellen"
      chapters:
        - text: "Introductie"
          href: Modellen/intro_modellen.qmd
        - Modellen/exponentielegroei.qmd
        - Modellen/odes_basis.qmd
        - Modellen/dichtheidseffecten.qmd
        - Modellen/ruimtelijkegroei.qmd
        - Modellen/predatorprooi.qmd
        - Modellen/odes_grind.qmd
        - Modellen/competitie.qmd
        #- Modellen/evolutiediversiteit.qmd
        - Modellen/zwermen.qmd
        - Modellen/reactiediffusie.qmd
        - Modellen/exciteerbaremedia.qmd
        - Modellen/project.qmd
        - Modellen/oefenvragen.qmd
    - part: "Statistiek"
      chapters:
        - Statistiek/Inleiding.qmd
        - Statistiek/BeschrijvendeStatistiek.qmd
        - Statistiek/Onzekerheid.qmd
        - Statistiek/Kansrekenen.qmd
        - Statistiek/Kansverdelingen.qmd
        - Statistiek/Schatten.qmd
        - Statistiek/Hypothesetoetsen.qmd
        - Statistiek/ToetsenGemiddelde.qmd
        - Statistiek/AssociatiesTussenVariabelen.qmd
        - Statistiek/LineaireRelatiesEnFitten.qmd
        - Statistiek/Oefenvragen.qmd
    #- voorbeelden.qmd
 #   - references.qmd
  appendices:
    - Appendices/antwoorden_R.qmd
    - Appendices/antwoorden_wiskunde.qmd
    - Appendices/antwoorden_modellen.qmd
    - Appendices/antwoorden_statistiek.qmd
    - Appendices/verdieping.qmd
    - Appendices/spiekbriefjes.qmd
    - Appendices/dankwoord.qmd

bibliography: references.bib

format:
  pdf:
    documentclass: scrbook
    lang: nl
    code-overflow: wrap
    toc: true
    toc-depth: 2
    papersize: a4
    highlight-style: arrow
    lof: false
    lot: false
    number-depth: 3
  # live-html = html + webR, for the runnable {webr} cells in the R chapters.
  # Needs the quarto-live extension in _extensions/ (committed to git).
  live-html:
    number-depth: 2
    html-math-method: 
      method: mathjax
      options:
        linebreaks: true
    code-line-numbers: false
    code-overflow: wrap
    lightbox: true
    footnotes-hover: true
    crossrefs-hover: true
    theme:
      light: 
        - stylesheet.css
      dark: 
        - stylesheet_dark.css
    # Everything for paper (single chapters and the print page): print.css / print.js
    css: print.css
    include-after-body:
      - text: <script src="/print.js"></script>
    toc: true
    toc-depth: 2
    toc-location: right
    toc-expand: false
    link-external-icon: true
    link-external-newwindow: true
    #mainfont: 'Georgia'
    fontsize: '6'
    #standalone: true
    #smooth-scroll: true
    #embed-resources: false
    linestretch: 1.5
    
website:
  sidebar:
    collapse-level: 3
