project:
  type: book

lang:
  nl

execute:
  freeze: false  # auto -> re-render only when source changes
  cache: false # true -> re-render chunks only when chunk changes 
    
book:
  title: "Kwantitatieve Biologie"
  author: "Vakgroep Theoretische Biologie, Universiteit Utrecht"
  language: "nl"
  page-footer:
    left: |
      Vakgroep Theoretische Biologie, Universiteit Utrecht.
    right: |
      Dit boek is gemaakt met <a href="https://quarto.org/">Quarto</a>.
  date: "6/20/2024"
  #cover-image: "figuren/cover.png"
  favicon: "figuren/favicon/favicon.ico"
  sidebar:
    logo: 'figuren/favicon/android-chrome-512x512.png'
    logo-alt: 'Cursusboek voor Biologische Modellen en Statistiek (voorheen: Kwantitatieve Biologie)'
    type: "dark"
    collapse-level: 1
    style: "floating" #"floating/docked"
    pinned: true
    title: "Kwantitatieve Biologie"
  chapters: 
    - part: "Cursusinformatie"
      chapters:
        - index.qmd
        - cursusinformatie.qmd
        - planning.qmd
        - links.qmd
    - part: "Basisprincipes van R"
      chapters:
        - Programmeren/introductie_R.qmd
        - Programmeren/introductie_R2.qmd
        - Programmeren/intro_R_questions.qmd
    - part: "Basiswiskunde"
      chapters:
        - Wiskunde/inleiding.qmd
        - Wiskunde/algebra.qmd
        - Wiskunde/breuken.qmd
        - Wiskunde/exponenten.qmd
        - Wiskunde/limieten.qmd
        - Wiskunde/afgeleiden.qmd
        - Wiskunde/schetsen.qmd
    - part: "Biologische modellen"
      chapters:
        - text: "Introductie"
          href: Modellen/modellen.qmd
        - Modellen/exponentielegroei.qmd
        - Modellen/odes_basis.qmd
        - Modellen/dichtheidseffecten.qmd
        - Modellen/ruimtelijkegroei.qmd
        - Modellen/meerderepopulaties.qmd
        - Modellen/competitie.qmd
        #- Modellen/evolutiediversiteit.qmd
        - Modellen/zwermen.qmd
        - Modellen/reactiediffusie.qmd
        - Modellen/exciteerbaremedia.qmd
        - Modellen/odes_grind.qmd
        - Modellen/project.qmd
    - part: "Statistiek"
      chapters:
        - Statistiek/wat_is_statistiek.qmd
    #- voorbeelden.qmd
 #   - references.qmd
  appendices:
    - Appendices/antwoorden_R.qmd
    - Appendices/antwoorden_wiskunde.qmd
    - Appendices/antwoorden_modelleren.qmd

bibliography: references.bib

format:
  pdf:
    documentclass: scrbook
    lang: nl
    code-overflow: wrap
    toc: true
    toc-depth: 2
    papersize: a4
    highlight-style: arrow
    lof: false
    lot: false
    number-depth: 3
    keep-tex: true
    include-in-header: 
       text: |
         \usepackage{fvextra}
         \DefineVerbatimEnvironment{Highlighting}{Verbatim}{breaklines,commandchars=\\\{\}}
         \DefineVerbatimEnvironment{OutputCode}{Verbatim}{breaklines,commandchars=\\\{\}}
    # include-in-header:
      # text: |
      #  \usepackage{libertine}
      #  \input{_macros.tex}
  html:
    number-depth: 3
    code-line-numbers: false
    code-overflow: wrap
    lightbox: true
    footnotes-hover: true
    crossrefs-hover: true
    theme:
      light: 
        - stylesheet.css
      dark: 
        - stylesheet_dark.css
    toc: true
    toc-depth: 2
    toc-location: right
    toc-expand: false
    link-external-icon: true
    link-external-newwindow: true
    #mainfont: 'Georgia'
    fontsize: '6'
    #standalone: true
    #smooth-scroll: true
    #embed-resources: false
    linestretch: 1.5
    
website:
  sidebar:
    collapse-level: 3
