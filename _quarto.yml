project:
  type: book

book:
  title: "Quantitative Biology"
  author: "Theoretical Biology Group, Utrecht University"
  page-footer:
    left: |
      Theoretical Biology Group, Utrecht University.
    right: |
      This book was built with <a href="https://quarto.org/">Quarto</a>.
  date: "2/26/2024"
  cover-image: "images/_a86b763c-3e7c-4fd5-8ce4-82c280b700c9.jpeg"
  favicon: "images/_a86b763c-3e7c-4fd5-8ce4-82c280b700c9.jpeg"
  chapters: 
    - index.qmd
#    - sniplets.qmd
    - part: Programmeren/intro_programming.qmd
      chapters:
        - Programmeren/intro_R.qmd
        - Programmeren/intro_RStudio.qmd
        - Programmeren/installation.qmd
        - Programmeren/problems_R.qmd
# modules toevoegen
    - part: Wiskunde/intro_maths.qmd
      chapters:
        - Wiskunde/fractions.qmd
        - Wiskunde/differentiation.qmd
        - Wiskunde/integration.qmd
        - Wiskunde/sets.qmd
        - Wiskunde/probability.qmd
        - Wiskunde/notation.qmd
        - Wiskunde/problems_maths.qmd
# voeg onderwerpen toe
    - part: Statistiek/intro_statistics.qmd
      chapters:
        - Statistiek/what_is_statistics.qmd
        - Statistiek/descriptive_statistics.qmd
        - Statistiek/estimation.qmd
        - Statistiek/hypothesis_tests.qmd
        - Statistiek/experiments.qmd
        - Statistiek/problems_stat.qmd
    - part: Modellering/intro_TB.qmd
      chapters:
        - Modellering/models.qmd
 #   - references.qmd
  appendices:
    - Appendices/appendixA.qmd

bibliography: references.bib

format:
  pdf:
    documentclass: scrreprt
    toc: true
    papersize: b5
    highlight-style: arrow
    lof: false
    lot: false
    number-depth: 3
    include-in-header:
      text: |
       \usepackage{libertine}
       \addtokomafont{disposition}{\rmfamily}
       \renewcommand{\ttdefault}{clmt}
       \input{_macros.tex}
  html:
    number-depth: 3
    lightbox: true
    theme: 
      - yeti
      - my_style_RH.css
#    include-in-header: 
#      - _macros.tex

#    callout-appearance: simple
#    mainfont: "Linux Libertine"




