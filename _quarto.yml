project:
  type: book

lang:
  nl
    

execute:
  freeze: auto  # re-render only when source changes
  cache: true # re-render chunks only when chunk changes 
    
book:
  title: "Kwantitatieve Biologie"
  author: "Vakgroep Biologie, Universiteit Utrecht"
  language: "nl"
  page-footer:
    left: |
      Vakgroep Biologie, Universiteit Utrecht.
    right: |
      Dit boek is gemaakt met <a href="https://quarto.org/">Quarto</a>.
  date: "6/20/2024"
  cover-image: "figuren/_a86b763c-3e7c-4fd5-8ce4-82c280b700c9.jpeg"
  favicon: "figuren/favicon/favicon.ico"
  sidebar:
    logo: 'figuren/favicon/android-chrome-512x512.png'
    logo-alt: 'Cursusboek voor Biologische Modellen en Statistiek (voorheen: Kwantitatieve Biologie)'
    type: "dark"
    collapse-level: 1
    style: "floating" #"floating/docked"
    pinned: true
    title: "Kwantitatieve Biologie"
  chapters: 
    - part: index.qmd
      chapters:
        - inleiding.qmd
    - part: "Basisprincipes van R"
      chapters:
        - Programmeren/intro_R_day1.qmd
        - Programmeren/intro_R_day2.qmd
        - Programmeren/intro_R_questions.qmd
    - part: "Basiswiskunde"
      chapters:
        - Wiskunde/algebra.qmd
        - Wiskunde/breuken.qmd
        - Wiskunde/exponenten.qmd
        - Wiskunde/limieten.qmd
        - Wiskunde/afgeleiden.qmd
        - Wiskunde/schetsen.qmd
    - part: "Biologische modellen"
      chapters:
        - Modellering/modellen.qmd
        - Modellering/groei_exponentieel.qmd
        - Modellering/groei_odes.qmd
        - Modellering/groei_dichtheid.qmd
        - Modellering/groei_ruimte.qmd
        - Modellering/ecoevo_meerdere.qmd
        - Modellering/ecoevo_grindbif.qmd
        - Modellering/ecoevo_competitie.qmd
        - Modellering/ecoevo_evolutiediversiteit.qmd
        - Modellering/patronen_zwermen.qmd
        - Modellering/patronen_reactie-diffusie.qmd
        - Modellering/patronen_exciteerbare-media.qmd
    - part: "Statistiek"
      chapters:
        - Statistiek/wat_is_statistiek.qmd
    #- voorbeelden.qmd
 #   - references.qmd
  appendices:
    - Appendices/antwoorden_wiskunde.qmd
    - Appendices/antwoorden_R.qmd
    - Appendices/antwoorden_modelleren.qmd
    #- Appendices/discrete_continue_ruimtes.qmd

bibliography: references.bib

format:
  pdf:
    documentclass: scrbook
    lang: nl
    code-overflow: wrap
    toc: true
    toc-depth: 2
    papersize: a4
    highlight-style: arrow
    lof: false
    lot: false
    number-depth: 3
    include-in-header:
      text: |
       \usepackage{libertine}
       \input{_macros.tex}
  html:
    number-depth: 3
    code-line-numbers: false
    code-overflow: wrap
    lightbox: true
    footnotes-hover: true
    crossrefs-hover: true
    theme:
      - yeti
      - my_style_RH.css
    #theme: minty
    toc: true
    toc-depth: 2
    toc-location: right
    toc-expand: false
    link-external-icon: true
    link-external-newwindow: true
    #mainfont: 'Georgia'
    fontsize: '6'
    #standalone: true
    #smooth-scroll: true
    #embed-resources: false
    linestretch: 1.5

website:
  sidebar:
    collapse-level: 3
