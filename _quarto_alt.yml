project:
  type: book

lang: nl

execute:
  freeze: auto  # re-render only when source changes
    
book:
  title: "Kwantitatieve Biologie"
  author: "Vakgroep Biologie, Universiteit Utrecht"
  language: "nl"
  page-footer:
    left: |
      Vakgroep Biologie, Universiteit Utrecht.
    right: |
      Dit boek is gemaakt met <a href="https://quarto.org/">Quarto</a>.
  date: "6/20/2024"
  cover-image: "figuren/_a86b763c-3e7c-4fd5-8ce4-82c280b700c9.jpeg"
  favicon: "figuren/_a86b763c-3e7c-4fd5-8ce4-82c280b700c9.jpeg"
  chapters: 
    - part: index.qmd
      chapters:
        - inleiding.qmd
    - part: Programmeren/intro_programmeren.qmd
      chapters:
        - Programmeren/intro_R_day1.qmd
        - Programmeren/intro_R_day2.qmd
        - Programmeren/intro_R_questions.qmd
    - part: Wiskunde/intro_wiskunde.qmd
      chapters:
        - Wiskunde/breuken.qmd
        - Wiskunde/exponenten.qmd
        - Wiskunde/logaritmen.qmd
        - Wiskunde/algebra.qmd
        - Wiskunde/limieten.qmd
        - Wiskunde/schetsen.qmd
        - Wiskunde/afgeleiden.qmd
    - voorbeelden.qmd
    - part: Modellering/intro_TB.qmd
      chapters:
        - Modellering/modellen.qmd
    - part: Statistiek/intro_statistiek.qmd
      chapters:
        - Statistiek/wat_is_statistiek.qmd
 #   - references.qmd
  appendices:
    - Appendices/appendixA.qmd

bibliography: references.bib

format:
  pdf:
    documentclass: scrbook
    lang: nl
    toc: true
    toc-depth: 2
    papersize: a4
    highlight-style: arrow
    lof: false
    lot: false
    number-depth: 3
    include-in-header:
      text: |
       \usepackage{libertine}
       \input{_macros.tex}
  html:
    number-depth: 3
    lightbox: true
    theme:
      - yeti
      - my_style_RH.css
    #theme: minty
    toc: true
    toc-depth: 2
    toc-location: right
    toc-expand: false
    link-external-icon: true
    link-external-newwindow: true
    #mainfont: 'Georgia'
    fontsize: '6'
    #standalone: true
    #smooth-scroll: true
    #embed-resources: false
    linestretch: 1.5

website:
  sidebar:
    collapse-level: 3
