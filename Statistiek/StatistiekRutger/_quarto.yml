project:
  type: book

lang: nl

execute:
  freeze: auto  # re-render only when source changes
#  cache: false

book:
  title: "Kwantitatieve Biologie"
  author: "Vakgroep Theoretische Biologie, Universiteit Utrecht"
  language: "nl"
  page-footer:
    left: |
      Vakgroep Biologie, Universiteit Utrecht.
    right: |
      Dit boek is gemaakt met <a href="https://quarto.org/">Quarto</a>.
#  date: "6/20/2024"
#  cover-image: "figuren/_a86b763c-3e7c-4fd5-8ce4-82c280b700c9.jpeg"
#  favicon: "figuren/_a86b763c-3e7c-4fd5-8ce4-82c280b700c9.jpeg"
  chapters: 
    - part: index.qmd
      chapters:
        - Inleiding.qmd
        - BeschrijvendeStatistiek.qmd
        - Onzekerheid.qmd
        - Kansrekenen.qmd
        - Kansverdelingen.qmd
        - Schatten.qmd
        - Hypothesetoetsen.qmd
        - ToetsenGemiddelde.qmd
        - P-waarden.qmd
        - AssociatiesTussenVariabelen.qmd
        - Experimenten.qmd
    - references.qmd
  appendices:
    - Appendices/appendix_minSS.qmd

#bibliography: references.bib

format:
  pdf:
    documentclass: scrbook
    lang: nl
    toc: true
    toc-depth: 2
    papersize: a4
    highlight-style: arrow
    lof: false
    lot: false
    number-depth: 3
    include-in-header:
      text: |
       \usepackage{libertine}
       \input{_macros.tex}
  html:
    number-depth: 3
    lightbox: true
    theme:
      - yeti
      - my_style_RH.css
    #theme: minty
    toc: true
    toc-depth: 2
    toc-location: right
    toc-expand: false
    link-external-icon: true
    link-external-newwindow: true
    #mainfont: 'Georgia'
    fontsize: '5'
    #standalone: true
    #smooth-scroll: true
    #embed-resources: false
    linestretch: 1.5
  epub:
    css: my_style_RH.css
    toc: true
    toc-depth: 2
    
website:
  sidebar:
    collapse-level: 3
