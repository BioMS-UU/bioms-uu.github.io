<script>
  // Get all the iframes replaced with a placeholder when print is called
  window.onbeforeprint = () => {
    
    const images = document.querySelectorAll('img#subset')
    //images.forEach((img) => { img.style.width = "60%"; });
    const imagesShow = document.querySelectorAll('img#imgToShow')
    imagesShow.forEach((img) => { img.style.display = "block"; img.style.marginBottom = "20px";});
    
    
    //document.body.style.fontFamily= "Georgia";
    const iframes = document.querySelectorAll("iframe#iframeToReplace");
    iframes.forEach((iframe, index) => {
                // Create a placeholder element with text
                const placeholder = document.createElement('div');
                placeholder.innerHTML += "<br><center><font size=1><i>Deze interactieve content vind je <a href='" +
                                          iframe.src + "'> hier</a><br><p style='font-size:smaller'>" + iframe.src 
                                          " </i></font></center>"
                iframe.parentNode.replaceChild(placeholder, iframe);
            });
  };
  
  // To go back to the normal layout after printing (in case people cancel printing...)
  window.onafterprint = () => {
      window.location.reload(true);
    }
    
</script>
